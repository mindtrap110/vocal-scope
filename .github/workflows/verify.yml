name: Verify Vocal Scope

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check app.js
          node --check history.js
          node --check vocal-scope-patch.js
          node --check pitch-core.js
          node --check pitch-worker.js
          node --check sw.js
      - name: Pitch detector smoke test
        run: |
          node <<'NODE'
          const P = require('./pitch-core.js');
          function tone(hz, sr=48000, n=4096) {
            const a = new Float32Array(n);
            for (let i=0;i<n;i++) a[i] = 0.7*Math.sin(2*Math.PI*hz*i/sr) + 0.2*Math.sin(4*Math.PI*hz*i/sr);
            return a;
          }
          for (const hz of [98,110,146.83,220,440]) {
            const r = P.detectPitch(tone(hz), 48000, {minHz:65,maxHz:1200,threshold:0.16});
            if (!r.frequency) throw new Error(`No pitch for ${hz} Hz`);
            const cents = 1200*Math.log2(r.frequency/hz);
            if (Math.abs(cents) > 10) throw new Error(`Pitch error ${cents.toFixed(1)}c at ${hz} Hz`);
          }
          console.log('Pitch smoke test passed');
          NODE